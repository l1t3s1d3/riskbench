# Reusable security pipeline for every repo in the org.
#
# Place this file in `<your-org>/.github/.github/workflows/security.yml`
# (yes, the double .github is correct: the repo is named `.github`, and
# workflow files live under its `.github/workflows/` directory). Each repo
# calls it with the 7-line caller workflow in `call-security.yml`.
#
# Results upload to GitHub Code Scanning as SARIF, so:
#   - findings show up in each repo's Security tab
#   - findings flow into RiskDesk through its existing GitHub connector,
#     no extra wiring; they land as category=code_scanning
#
# Language-specific scanners (ruff/bandit/pip-audit) only run when they
# find input to scan, so a Go or Node repo won't spend time on them.

name: Security pipeline

on:
  workflow_call:
    inputs:
      severity-threshold:
        description: Minimum severity that fails the build (critical|high|medium|low)
        type: string
        default: high
      skip-codeql:
        description: Skip CodeQL analysis (use when the calling repo runs its own)
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write    # upload SARIF to code scanning
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 1. Secrets
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # gitleaks scans history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  # ---------------------------------------------------------------- 2. SAST (polyglot)
  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan with p/default + language auto
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --sarif --output=semgrep.sarif \
            --severity=INFO \
            --error --metrics=off || echo "semgrep found issues"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------- 3. Dependencies
  trivy:
    name: Dependencies & IaC (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: '0'          # upload first, then fail
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Fail on severity threshold
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: ${{ inputs.severity-threshold == 'critical' && 'CRITICAL' || (inputs.severity-threshold == 'high' && 'CRITICAL,HIGH' || (inputs.severity-threshold == 'medium' && 'CRITICAL,HIGH,MEDIUM' || 'CRITICAL,HIGH,MEDIUM,LOW')) }}
          exit-code: '1'
          ignore-unfixed: true

  # ---------------------------------------------------------------- 4. CodeQL (polyglot SAST)
  # Covers Python, JS/TS, Java, Go, C/C++, C#, Ruby, Swift, Kotlin.
  # Skip when the calling repo already runs it in a sibling workflow.
  codeql:
    name: CodeQL
    if: ${{ !inputs.skip-codeql }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, java, go, ruby, csharp]
    steps:
      - uses: actions/checkout@v4
      - name: Detect whether this language is present
        id: detect
        run: |
          case "${{ matrix.language }}" in
            python)                has=$(find . -name '*.py' -not -path './.git/*' | head -1) ;;
            javascript-typescript) has=$(find . \( -name '*.js' -o -name '*.ts' -o -name '*.jsx' -o -name '*.tsx' \) -not -path './node_modules/*' -not -path './.git/*' | head -1) ;;
            java)                  has=$(find . -name '*.java' -not -path './.git/*' | head -1) ;;
            go)                    has=$(find . -name 'go.mod' -not -path './.git/*' | head -1) ;;
            ruby)                  has=$(find . -name '*.rb' -not -path './.git/*' | head -1) ;;
            csharp)                has=$(find . -name '*.cs' -not -path './.git/*' | head -1) ;;
          esac
          [ -n "$has" ] && echo "present=true" >> $GITHUB_OUTPUT || echo "present=false" >> $GITHUB_OUTPUT
      - uses: github/codeql-action/init@v3
        if: steps.detect.outputs.present == 'true'
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        if: steps.detect.outputs.present == 'true'
        with:
          category: /language:${{ matrix.language }}

  # ---------------------------------------------------------------- 5. Python extras
  python-extras:
    name: Python (ruff + bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: hasPython
        run: |
          if find . -name '*.py' -not -path './.git/*' | head -1 | grep -q .; then
            echo "yes=true" >> $GITHUB_OUTPUT
          else
            echo "yes=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.hasPython.outputs.yes == 'true'
        with:
          python-version: '3.11'
      - name: Install scanners
        if: steps.hasPython.outputs.yes == 'true'
        run: pip install -q 'ruff==0.6.*' 'bandit[sarif]==1.7.*' 'pip-audit==2.7.*'
      - name: ruff
        if: steps.hasPython.outputs.yes == 'true'
        run: ruff check . --output-format=sarif --output-file=ruff.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        if: steps.hasPython.outputs.yes == 'true' && always()
        with:
          sarif_file: ruff.sarif
          category: ruff
      - name: bandit
        if: steps.hasPython.outputs.yes == 'true'
        run: bandit -r . -q -f sarif -o bandit.sarif --severity-level medium --confidence-level high || true
      - uses: github/codeql-action/upload-sarif@v3
        if: steps.hasPython.outputs.yes == 'true' && always()
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: pip-audit (requirements.txt, pyproject.toml)
        if: steps.hasPython.outputs.yes == 'true'
        run: |
          found=0
          for f in requirements.txt pyproject.toml; do
            [ -f "$f" ] && found=1 && pip-audit -r "$f" --strict 2>&1 || true
          done
          [ "$found" = 0 ] && echo "no python manifest, skipping"

  # ---------------------------------------------------------------- Summary job
  # One easy status check for branch protection: "Security pipeline / summary".
  summary:
    needs: [gitleaks, semgrep, trivy, codeql, python-extras]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any scanner failed
        run: |
          echo "gitleaks:      ${{ needs.gitleaks.result }}"
          echo "semgrep:       ${{ needs.semgrep.result }}"
          echo "trivy:         ${{ needs.trivy.result }}"
          echo "codeql:        ${{ needs.codeql.result }}"
          echo "python-extras: ${{ needs.python-extras.result }}"
          for r in "${{ needs.gitleaks.result }}" "${{ needs.semgrep.result }}" \
                   "${{ needs.trivy.result }}" "${{ needs.codeql.result }}" \
                   "${{ needs.python-extras.result }}"; do
            case "$r" in success|skipped) : ;; *) echo "::error::scanner failed: $r"; exit 1 ;; esac
          done
