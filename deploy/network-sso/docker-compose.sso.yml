version: "3.8"

services:
  riskdesk:
    build: ../../riskdesk
    container_name: riskdesk
    restart: unless-stopped
    volumes:
      - riskdesk-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file: .env
    environment:
      RISKDESK_DB_URL: sqlite:////data/riskdesk.db
      RISKDESK_HOST: "0.0.0.0"
      RISKDESK_PORT: "8080"
      RISKDESK_SCHEDULER: "1"
      RISKDESK_AUTH: proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/meta"]
      interval: 30s
      timeout: 5s
      start_period: 15s
    networks:
      - riskbench-internal

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: riskdesk-oauth2-proxy
    restart: unless-stopped
    command:
      - --http-address=0.0.0.0:4180
      - --upstream=http://riskdesk:8080
      - --provider=${OAUTH_PROVIDER:-oidc}
      - --client-id=${OAUTH_CLIENT_ID}
      - --client-secret=${OAUTH_CLIENT_SECRET}
      - --oidc-issuer-url=${OAUTH_ISSUER_URL}
      - --cookie-secret=${OAUTH_COOKIE_SECRET}
      - --cookie-secure=${OAUTH_COOKIE_SECURE:-true}
      - --email-domain=*
      - --set-xauthrequest=true
      - --pass-user-headers=true
      - --pass-access-token=false
      - --skip-provider-button=${OAUTH_SKIP_PROVIDER_BUTTON:-false}
      - --scope=${OAUTH_SCOPES:-openid email profile}
    networks:
      - riskbench-internal
    depends_on:
      riskdesk:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: riskdesk-nginx
    restart: unless-stopped
    ports:
      - "${RISKDESK_HTTPS_PORT:-443}:443"
      - "${RISKDESK_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-./certs/cert.pem}:/etc/nginx/ssl/cert.pem:ro
      - ${TLS_KEY_PATH:-./certs/key.pem}:/etc/nginx/ssl/key.pem:ro
    networks:
      - riskbench-internal
    depends_on:
      - oauth2-proxy

volumes:
  riskdesk-data:

networks:
  riskbench-internal:
    name: riskbench-internal
    driver: bridge
    internal: false
