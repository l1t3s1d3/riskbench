# Repo-level tool config. The deploy security pipeline reads this.
#
# ruff rules here are deliberately narrow: only patterns that correlate with
# runtime bugs or security issues block the deploy. Style (import ordering,
# unused imports) is left to `make lint` so a stray F401 does not take prod
# down. Add rules carefully -- every one gates every deploy.

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
    "deploy",
    "**/network-sso",
    "**/.venv",
    "**/__pycache__",
]

[tool.ruff.lint]
select = [
    "F821",   # undefined name  (real bug)
    "F822",   # undefined __all__ entry
    "F823",   # local var referenced before assignment
    "F501",   # invalid % format
    "F502",   # % expected mapping
    "F631",   # assert on a tuple -- always truthy
    "F701",   # break outside loop
    "F702",   # continue outside loop
    "F704",   # yield outside function
    "F706",   # return outside function
    "E9",     # syntax errors
    "B002",   # ++/-- (no such operator in python)
    "B006",   # mutable default argument
    "B008",   # function call in default arg (except FastAPI Depends/Query)
    "B018",   # expression statement with no effect
    "B023",   # function uses variable from loop that is reassigned later
    "S102",   # exec()
    "S103",   # permissive file permissions
    "S106",   # hardcoded password func arg
    "S108",   # insecure usage of /tmp
    "S301",   # pickle load
    "S307",   # eval
    "S506",   # yaml.load without SafeLoader
    "S608",   # possible SQL injection
    "S701",   # jinja2 autoescape=False
    "ASYNC100", # await in sync function
]

# B008 is noisy on FastAPI's `Depends(...)` / `Query(...)` defaults; they are
# the sanctioned way to declare dependencies.
per-file-ignores = {}

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Header",
]

# A separate, strict profile for `make lint` -- not used by the deploy pipeline.
[tool.ruff.lint.extend-per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point in tests
